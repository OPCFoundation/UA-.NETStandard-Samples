#
# Run the sample test suite
#
# The tiers are documented in docs/TESTING.md. Tier 0 (configuration) needs nothing but
# the sources, the higher tiers start sample servers on localhost, and tier 2 builds the
# main form of every WinForms client on an STA thread - which is why this job runs on a
# Windows agent and no test category is filtered out.
#
# The samples bind fixed ports, so this job must not run beside another one on the same
# agent.
#
jobs:
- job: testsamples
  displayName: Test Samples
  pool:
    vmImage: 'windows-2025-vs2026'
  variables:
    DOTNET_CLI_TELEMETRY_OPTOUT: true
    DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  steps:
  - task: NuGetAuthenticate@1
  - task: UseDotNet@2
    displayName: 'Install .NET 10.0'
    inputs:
      packageType: 'sdk'
      version: '10.0.x'
  - task: DotNetCoreCLI@2
    displayName: Restore Tests
    inputs:
      command: restore
      projects: 'Tests/**/*.csproj'
      includeNuGetOrg: true
      feedsToUse: config
      nugetConfigPath: $(Build.SourcesDirectory)/Nuget.Config
  - task: DotNetCoreCLI@2
    displayName: Build Tests
    inputs:
      command: build
      projects: 'Tests/**/*.csproj'
      arguments: '--no-restore --configuration Release'
  - task: DotNetCoreCLI@2
    displayName: Run Tests
    inputs:
      command: test
      projects: 'Tests/**/*.Tests.csproj'
      # the task adds --logger trx and --results-directory itself when it publishes the
      # results, so repeating them here makes dotnet test reject the command line.
      # No category is filtered out: the tier 2 client tests are tagged RequiresDesktop
      # and this job runs on a Windows agent, which is what they need.
      # --collect + --settings turn on the coverlet 'XPlat Code Coverage' data
      # collector, which writes a coverage.cobertura.xml per test project. The
      # exclusions (test and harness assemblies) live in coverlet.runsettings.xml.
      arguments: '--no-build --configuration Release --collect:"XPlat Code Coverage" --settings $(Build.SourcesDirectory)/Tests/coverlet.runsettings.xml'
      publishTestResults: true
      testRunTitle: 'Sample smoke tests'
  # Merge the per-project Cobertura fragments into a single report so the Code
  # Coverage tab shows one consolidated result instead of one per test project.
  - task: DotNetCoreCLI@2
    displayName: Install ReportGenerator
    inputs:
      command: custom
      custom: tool
      arguments: install --tool-path $(Agent.TempDirectory)/tools dotnet-reportgenerator-globaltool
  - task: PowerShell@2
    displayName: Merge Code Coverage
    inputs:
      pwsh: true
      targetType: inline
      script: |
        & '$(Agent.TempDirectory)/tools/reportgenerator' `
          "-reports:$(Agent.TempDirectory)/**/coverage.cobertura.xml" `
          "-targetdir:$(Build.SourcesDirectory)/CodeCoverage" `
          "-reporttypes:Cobertura;HtmlInline_AzurePipelines" `
          "-title:UA .NET Standard Samples Coverage" `
          "-assemblyfilters:-*.Tests;-Samples.Tests.Common;-Samples.Servers.Hosting"
  - task: PublishCodeCoverageResults@2
    displayName: Publish Code Coverage
    condition: succeededOrFailed()
    inputs:
      summaryFileLocation: '$(Build.SourcesDirectory)/CodeCoverage/Cobertura.xml'
