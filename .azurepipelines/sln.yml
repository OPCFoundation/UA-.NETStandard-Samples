#
# Build the solution on windows
#
jobs:
- job: buildallsln
  displayName: Build Solution
  pool:
    vmImage: 'windows-2025-vs2026'
  steps:
  # see ci.yml: the Github-Feed NuGet service connection authenticates the
  # OPC Foundation GitHub Packages feed declared in Nuget.Config.
  - task: NuGetAuthenticate@1
    inputs:
      nuGetServiceConnections: 'Github-Feed'
  - task: UseDotNet@2
    displayName: 'Install .NET 10.0'
    inputs:
      packageType: 'sdk'
      version: '10.0.x'
  # MSBuild restores the .slnx itself, with the credentials NuGetAuthenticate
  # installed above, and reads the package sources from Nuget.Config.
  - task: MSBuild@1
    displayName: Restore Release
    inputs:
      solution: 'UA Samples.slnx'
      configuration: 'Release'
      platform: 'Any CPU'
      msbuildArguments: '/t:Restore'
  - task: MSBuild@1
    displayName: MS Build Release
    inputs:
      solution: 'UA Samples.slnx'
      configuration: 'Release'
      platform: 'Any CPU'
      msbuildArguments:
  - task: MSBuild@1
    displayName: Restore Debug
    inputs:
      solution: 'UA Samples.slnx'
      configuration: 'Debug'
      platform: 'Any CPU'
      msbuildArguments: '/t:Restore'
  - task: MSBuild@1
    displayName: MS Build Debug
    inputs:
      solution: 'UA Samples.slnx'
      configuration: 'Debug'
      platform: 'Any CPU'
      msbuildArguments:
